<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animasi Gambar</title>

    <style>
      body {
        text-align: center;
        font-family: Arial, sans-serif;
        padding-top: 50px;
        background: #f5f5f5;
      }

      .gambar {
        width: 300px;
        max-width: 90%;
        border-radius: 15px;

        /* Animasi gambar */
        opacity: 0;
        animation: muncul 1.2s ease-out forwards;
      }

      @keyframes muncul {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>

  <body>
    <h2>Meli cantikkkkk!</h2>

    <img src="images/meli.jpeg" alt="sayangkuu" class="gambar" />
  </body>
</html>
